async function atrakink(slapt,tylus){
  var b=document.getElementById('b'), kl=document.getElementById('kl');
  if(!tylus){b.disabled=true;b.textContent='Atrakinama…';}
  var med=await crypto.subtle.importKey("raw",new TextEncoder().encode(slapt),"PBKDF2",false,["deriveKey"]);
  for(var i=0;i<D.r.length;i++){
    var r=D.r[i];
    try{
      var k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:baitai(r.d),iterations:D.it,hash:"SHA-256"},
        med,{name:"AES-GCM",length:256},false,["decrypt"]);
      var cek=await crypto.subtle.decrypt({name:"AES-GCM",iv:baitai(r.iv)},k,baitai(r.w));
      var ck=await crypto.subtle.importKey("raw",cek,{name:"AES-GCM"},false,["decrypt"]);
      var pl=await crypto.subtle.decrypt({name:"AES-GCM",iv:baitai(D.iv)},ck,baitai(D.c));
      try{sessionStorage.setItem(RAKTAS,slapt)}catch(e){}
      window.__ALON_KAS=r.v; window.__ALON_TYLUS=!!r.t;
      var h=new TextDecoder().decode(pl);
      /* ⚠ document.write cia netinka: Chrome nutraukia nagrinejima po pirmo
         skripto ir uzdaro prieiga prie localStorage. */
      var doc=new DOMParser().parseFromString(h,"text/html");
      document.replaceChild(document.importNode(doc.documentElement,true),document.documentElement);
      var t=doc.querySelector("title"); if(t) document.title=t.textContent;
      [].forEach.call(document.querySelectorAll("script"),function(sen){
        var n=document.createElement("script");
        for(var j=0;j<sen.attributes.length;j++) n.setAttribute(sen.attributes[j].name,sen.attributes[j].value);
        n.textContent=sen.textContent; sen.parentNode.replaceChild(n,sen);
      });
      return;
    }catch(e){}
  }
  if(!tylus){
    b.disabled=false;b.textContent='Atidaryti';
    kl.textContent='Neteisingas slaptažodis';kl.classList.add('on');
    var v=document.querySelector('.v');v.classList.remove('purt');void v.offsetWidth;v.classList.add('purt');
    var inp=document.getElementById('s');inp.value='';inp.focus();

}
document.getElementById('f').addEventListener('submit',function(e){
  e.preventDefault();var v=document.getElementById('s').value;if(v)atrakink(v,false);
});
